name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Python dependencies
        run: uv sync --group dev
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint web application
        run: pnpm run lint:web
      - name: Type-check web application
        run: pnpm run typecheck:web
      - name: Run web tests
        run: pnpm run test:web
      - name: Build web application
        run: pnpm run build:web-assets
      - name: Verify generated web assets
        run: |
          git diff --exit-code -- src/service_console/static
          test -z "$(git ls-files --others --exclude-standard -- src/service_console/static)"
      - name: Run tests
        run: uv run pytest
