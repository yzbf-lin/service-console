name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web application
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and type-check web application
        run: |
          pnpm run lint:web
          pnpm run typecheck:web
      - name: Run web tests
        run: pnpm run test:web
      - name: Build and verify embedded web assets
        run: |
          pnpm run build:web-assets
          test -f src-tauri/resources/static/index.html
          test -f src-tauri/resources/static/THIRD_PARTY_LICENSES.txt
          grep -q '__SERVICE_CONSOLE_THEME__' src-tauri/resources/static/index.html
          grep -q '/static/_next/' src-tauri/resources/static/index.html
      - name: Verify Rust-only native runtime
        run: |
          test ! -e pyproject.toml
          test ! -e uv.lock
          test -z "$(git ls-files 'src/service_console/**')"
          test -z "$(git ls-files '*.py')"

  rust-native:
    name: Rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: app
          - os: windows-2025
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
      - name: Build native desktop bundle
        run: pnpm tauri build --debug --bundles ${{ matrix.bundle }}
      - name: Verify macOS transition bundle
        if: runner.os == 'macOS'
        run: |
          APP="target/debug/bundle/macos/Service Console.app"
          test -x "$APP/Contents/MacOS/Service Console"
          test -x "$APP/Contents/MacOS/service-console"
          test -x "$APP/Contents/MacOS/service-console-mcp"
          test -x "$APP/Contents/MacOS/service-console-guardian"
          test -x "$APP/Contents/MacOS/service-console-updater"
          RESPONSE="$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' | \
            "$APP/Contents/MacOS/service-console-mcp")"
          grep -q '"name":"service-console"' <<<"$RESPONSE"
          grep -q '"name":"service_group_start"' <<<"$RESPONSE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = \
            "dev.service-console.desktop"
      - name: Verify Windows transition binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "target/debug/Service Console.exe" -PathType Leaf)) {
            throw "Rust desktop binary is missing"
          }
          if (-not (Test-Path "target/debug/service-console-updater.exe" -PathType Leaf)) {
            throw "Rust transition updater is missing"
          }
          if (-not (Test-Path "target/debug/service-console-mcp.exe" -PathType Leaf)) {
            throw "Rust MCP bridge is missing"
          }
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          ) -join "`n"
          $response = $requests | & "target/debug/service-console-mcp.exe"
          $responseText = $response -join "`n"
          if ($LASTEXITCODE -ne 0 -or $responseText -notmatch 'service_group_start') {
            throw "Rust MCP bridge tool-list smoke test failed"
          }
