name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Python dependencies
        run: uv sync --group dev
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint web application
        run: pnpm run lint:web
      - name: Type-check web application
        run: pnpm run typecheck:web
      - name: Run web tests
        run: pnpm run test:web
      - name: Build web application
        run: pnpm run build:web-assets
      - name: Verify generated web assets
        run: uv run pytest tests/test_static_assets.py
      - name: Run remaining tests
        run: uv run pytest --ignore=tests/test_static_assets.py
