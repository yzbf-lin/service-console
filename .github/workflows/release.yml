name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          test -n "$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build application
        run: ./scripts/build-macos-app.sh
      - name: Smoke-test executable and signature
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          codesign --verify --deep --strict "dist/Service Console.app"
          "dist/Service Console.app/Contents/MacOS/Service Console" --help >/dev/null
          "dist/Service Console.app/Contents/MacOS/Service Console MCP" --help >/dev/null
          uv run --locked python scripts/smoke_test_mcp_helper.py \
            "dist/Service Console.app/Contents/MacOS/Service Console MCP"
      - name: Package application
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="release/Service Console"
          mkdir -p "$STAGE"
          ditto "dist/Service Console.app" "$STAGE/Service Console.app"
          cp LICENSE README.md README.zh-CN.md "$STAGE/"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" \
            "release/Service-Console-v${VERSION}-macOS-arm64.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: service-console-macos-arm64
          path: release/Service-Console-*.zip
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$'
          if (-not $match) { throw "Unable to read project version" }
          $version = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match pyproject version $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Run Windows Python tests
        shell: pwsh
        run: |
          uv sync --locked --group dev
          uv run --locked pytest
      - name: Build application
        shell: pwsh
        run: ./scripts/build-windows-app.ps1
      - name: Smoke-test executable
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist/Service Console/Service Console.exe" `
            -ArgumentList "--help" `
            -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "Desktop executable smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            throw "Desktop executable smoke test failed with exit code $($process.ExitCode)"
          }
          & "dist/Service Console/Service Console Updater.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Updater smoke test failed with exit code $LASTEXITCODE"
          }
          & "dist/Service Console/Service Console MCP.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "MCP helper smoke test failed with exit code $LASTEXITCODE"
          }
          uv run --locked python scripts/smoke_test_mcp_helper.py `
            "dist/Service Console/Service Console MCP.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "MCP helper handshake failed with exit code $LASTEXITCODE"
          }
      - name: Package application
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $appDir = "dist/Service Console"
          Copy-Item LICENSE, README.md, README.zh-CN.md -Destination $appDir
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path $appDir -DestinationPath "release/Service-Console-v$version-Windows-x64.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: service-console-windows-x64
          path: release/Service-Console-*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: service-console-*
          merge-multiple: true
          path: release
      - name: Create checksums
        run: |
          cd release
          sha256sum Service-Console-*.zip > SHA256SUMS.txt
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Prepare locked signing dependencies
        run: uv sync --frozen --no-dev --no-install-project
      - name: Create signed update manifest
        env:
          UPDATE_PRIVATE_KEY_B64: ${{ secrets.SERVICE_CONSOLE_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$UPDATE_PRIVATE_KEY_B64"
          uv run --frozen --no-sync \
            python scripts/create_update_manifest.py \
              --version "$VERSION" \
              --repository "$GITHUB_REPOSITORY" \
              --published-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_STATE="$(
            gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || true
          )"
          if [[ "$RELEASE_STATE" == "false" ]]; then
            echo "Published release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if [[ "$RELEASE_STATE" != "true" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Service Console $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --latest \
            --verify-tag
