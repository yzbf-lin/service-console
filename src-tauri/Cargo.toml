[package]
name = "service-console"
version = "0.4.0"
description = "Native process supervisor with web, terminal, and MCP interfaces"
authors = ["Service Console contributors"]
edition = "2024"
license = "MIT"
default-run = "service-console-desktop"

[lib]
name = "service_console"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "service-console-desktop"
path = "src/main.rs"

[[bin]]
name = "service-console"
path = "src/bin/service-console.rs"

[[bin]]
name = "service-console-mcp"
path = "src/bin/service-console-mcp.rs"

[[bin]]
name = "service-console-guardian"
path = "src/bin/service-console-guardian.rs"

[[bin]]
name = "service-console-updater"
path = "src/bin/service-console-updater.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
crossterm = "0.29.0"
dirs = "6.0.0"
ed25519-dalek = { version = "2.2.0", features = ["pem", "pkcs8"] }
futures-util = "0.3.31"
fs2 = "0.4.3"
hex = "0.4.3"
keyring = "4.2.0"
libc = "0.2.177"
netstat2 = "0.11.2"
percent-encoding = "2.3.2"
rand = "0.9.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["cookies", "json", "rustls-tls", "stream"] }
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
shlex = "1.3.0"
subtle = "2.6.1"
sysinfo = "0.38.4"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
tower-http = { version = "0.6.6", features = ["fs", "trace"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
spki = { version = "0.7.3", features = ["pem"] }
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
